services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-attendance}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      POSTGRES_DB: ${POSTGRES_DB:-attendance}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-attendance}"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      # Host port is configurable and does NOT default to 5432: a developer machine
      # very often already runs Postgres there, and the stack does not need this
      # mapping at all — the backend reaches Postgres over the compose network.
      # Exposed only for inspecting the database from the host.
      - "${POSTGRES_HOST_PORT:-55432}:5432"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-attendance}:${POSTGRES_PASSWORD:-change_me}@postgres:5432/${POSTGRES_DB:-attendance}
      LIVENESS_MODEL_PATH: /app/models/liveness.onnx
      LIVENESS_THRESHOLD: ${LIVENESS_THRESHOLD:-0.5}
      FACE_MATCH_THRESHOLD: ${FACE_MATCH_THRESHOLD:-0.5}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Without this the backend refuses authenticated routes with 503 rather than
      # serving them openly — which is the intended behaviour, and is how this
      # omission was found.
      API_KEY: ${API_KEY:?set API_KEY in .env}
    volumes:
      # Models are mounted, not baked in. Retraining swaps the file; no rebuild.
      - ./models:/app/models
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${BACKEND_HOST_PORT:-8000}:8000"

  frontend:
    build:
      context: ./frontend
    depends_on:
      - backend
    ports:
      - "${FRONTEND_HOST_PORT:-8080}:8080"

volumes:
  pgdata:
