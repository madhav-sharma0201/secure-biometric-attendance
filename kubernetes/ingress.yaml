apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: attendance-ingress
  namespace: attendance
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "25m"   # verification frame bursts
spec:
  ingressClassName: nginx
  rules:
    - host: attendance.local
      http:
        paths:
          # Only the frontend and the API are exposed. Nothing routes directly to
          # Postgres — it stays a ClusterIP-only service inside the cluster.
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port: { number: 8000 }
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port: { number: 80 }
