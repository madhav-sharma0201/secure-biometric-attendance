name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install prometheus-client alembic

      - name: Lint
        run: |
          pip install ruff
          ruff check backend ml scripts --output-format=github || true

      - name: Run tests
        run: python -m pytest -q

      - name: Verify migrations apply and roll back
        env:
          DATABASE_URL: sqlite:////tmp/ci.db
        run: |
          alembic upgrade head
          alembic downgrade base

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Fails the build on committed credentials. This repo holds biometric code;
      # a leaked key here is not a cosmetic problem.
      - name: Scan history for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t attendance-backend:ci -f backend/Dockerfile .
      - name: Build frontend image
        run: docker build -t attendance-frontend:ci ./frontend
      - name: Verify backend runs as non-root
        run: |
          uid=$(docker run --rm --entrypoint id attendance-backend:ci -u)
          echo "backend uid: $uid"
          test "$uid" != "0" || (echo "container runs as root" && exit 1)
