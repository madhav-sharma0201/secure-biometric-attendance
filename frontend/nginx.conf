server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;

        # index.html must not be cached. A kiosk that pins a stale page keeps calling
        # the old API path and sending the old key long after a redeploy, and the
        # failure looks like a backend outage rather than a cache.
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        expires 0;
    }

    # Proxy the API so the browser sees one origin and no CORS is needed in production.
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 25m;   # a verification burst is several JPEGs
    }
}
